openapi: 3.0.3
info:
  title: StudySwap API
  version: 0.1.0
  description: |
    Контракт API платформи StudySwap для обміну навчальними матеріалами.
    Базовий CRUD для ресурсу «Матеріал» (контекст «Каталог матеріалів»).

    Усі помилки повертаються в єдиному форматі `ErrorResponse`.
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки

tags:
  - name: Materials
    description: Каталог навчальних матеріалів
  - name: Health
    description: Службові ендпоїнти

paths:
  /health:
    get:
      tags: [Health]
      summary: Перевірка, що сервер працює
      description: Не потребує входу й не звертається до БД. Використовується для моніторингу та healthcheck у Docker.
      operationId: getHealth
      responses:
        '200':
          description: Сервер працює
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /materials:
    post:
      tags: [Materials]
      summary: Додати матеріал
      description: Створює новий матеріал. Автор визначається з токена, а не з тіла запиту.
      operationId: createMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreateRequest'
      responses:
        '201':
          description: Матеріал створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Materials]
      summary: Список матеріалів (пошук, фільтри, сортування)
      description: Повертає опубліковані матеріали. Доступно всім, зокрема гостям.
      operationId: listMaterials
      parameters:
        - name: q
          in: query
          description: Пошук за назвою
          schema:
            type: string
            maxLength: 100
        - name: subject
          in: query
          schema:
            type: string
        - name: university
          in: query
          schema:
            type: string
        - name: course
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MaterialType'
        - name: sort
          in: query
          description: new — спочатку нові, title — за назвою А-Я
          schema:
            type: string
            enum: [new, title]
            default: new
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Список матеріалів (порожній, якщо нічого не знайдено)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /materials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор матеріалу
        schema:
          type: integer
          minimum: 1
        example: 100

    get:
      tags: [Materials]
      summary: Деталі матеріалу
      operationId: getMaterial
      responses:
        '200':
          description: Матеріал знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Materials]
      summary: Оновити матеріал
      description: Частково оновлює матеріал. Змінювати може лише автор або адмін. Передаються тільки змінені поля.
      operationId: updateMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialUpdateRequest'
      responses:
        '200':
          description: Матеріал оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Materials]
      summary: Видалити матеріал
      description: Автор видаляє свій матеріал, адмін — будь-який.
      operationId: deleteMaterial
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Матеріал видалено (тіла відповіді немає)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MaterialType:
      type: string
      description: Тип матеріалу
      enum:
        - конспект
        - лекція
        - практична
        - лабораторна
        - презентація
        - відео
        - аудіо
        - курсова
        - дипломна
        - магістерська
      example: конспект

    MaterialCreateRequest:
      type: object
      description: DTO для створення матеріалу (тіло POST /materials)
      required: [title, subject, university, course, type, fileId]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        subject:
          type: string
          minLength: 1
        university:
          type: string
          minLength: 1
        course:
          type: integer
          minimum: 1
          maximum: 6
        type:
          $ref: '#/components/schemas/MaterialType'
        fileId:
          type: string
          description: Ключ уже завантаженого файлу у сховищі (StoredFile.id)
      example:
        title: Нормалізація БД
        description: 1НФ–3НФ з прикладами
        subject: Бази даних
        university: КПІ
        course: 2
        type: конспект
        fileId: f-8c1e2b

    MaterialUpdateRequest:
      type: object
      description: DTO для оновлення (тіло PATCH /materials/{id}). Усі поля необов'язкові, але потрібне хоча б одне. Файл змінити не можна.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        subject:
          type: string
          minLength: 1
        university:
          type: string
          minLength: 1
        course:
          type: integer
          minimum: 1
          maximum: 6
        type:
          $ref: '#/components/schemas/MaterialType'
      example:
        title: Нормалізація БД (оновлено)
        course: 3

    MaterialFile:
      type: object
      description: Файл, прикріплений до матеріалу
      required: [fileName, format, sizeBytes, url]
      properties:
        fileName:
          type: string
        format:
          type: string
          enum: [pdf, doc, docx, txt, ppt, pptx, zip, mp3, wav, mp4]
        sizeBytes:
          type: integer
          minimum: 0
        url:
          type: string
      example:
        fileName: normalization.pdf
        format: pdf
        sizeBytes: 2097152
        url: /files/f-8c1e2b

    MaterialResponse:
      type: object
      description: DTO матеріалу у відповідях. Внутрішнє поле status не передається.
      required: [id, title, subject, university, course, type, file, authorId, authorNickname, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        subject:
          type: string
        university:
          type: string
        course:
          type: integer
        type:
          $ref: '#/components/schemas/MaterialType'
        file:
          $ref: '#/components/schemas/MaterialFile'
        authorId:
          type: integer
        authorNickname:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 100
        title: Нормалізація БД
        description: 1НФ–3НФ з прикладами
        subject: Бази даних
        university: КПІ
        course: 2
        type: конспект
        file:
          fileName: normalization.pdf
          format: pdf
          sizeBytes: 2097152
          url: /files/f-8c1e2b
        authorId: 1
        authorNickname: Anna
        createdAt: '2026-11-20T10:15:00Z'
        updatedAt: '2026-11-20T11:20:00Z'

    MaterialListResponse:
      type: object
      description: Сторінка результатів пошуку
      required: [items, total, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialResponse'
        total:
          type: integer
          description: Скільки всього знайдено
        page:
          type: integer
          description: Номер поточної сторінки

    ErrorResponse:
      type: object
      description: |
        Єдиний формат помилки для всіх ендпоїнтів.

        Коди (`code`) за категоріями:
        - ValidationError (400): TITLE_REQUIRED, TITLE_TOO_LONG, INVALID_DESCRIPTION,
          DESCRIPTION_TOO_LONG, SUBJECT_REQUIRED, UNIVERSITY_REQUIRED, COURSE_OUT_OF_RANGE,
          INVALID_TYPE, FILE_REQUIRED, INVALID_FILE, EMPTY_UPDATE, UNKNOWN_FIELD,
          INVALID_BODY, INVALID_JSON, QUERY_TOO_LONG, INVALID_QUERY, INVALID_SORT, INVALID_PAGE;
        - Unauthorized (401): UNAUTHORIZED;
        - Forbidden (403): FORBIDDEN;
        - NotFound (404): MATERIAL_NOT_FOUND, ROUTE_NOT_FOUND;
        - InternalError (500): code = null.

        Політика кодів — docs/adr/0003-api-style-and-error-model.md.
      required: [error, requestId]
      properties:
        error:
          type: string
          description: Категорія помилки
          enum: [ValidationError, Unauthorized, Forbidden, NotFound, InternalError]
        code:
          type: string
          nullable: true
          description: Конкретна причина
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Ідентифікатор запиту для пошуку в логах
      example:
        error: ValidationError
        code: TITLE_REQUIRED
        details:
          - field: title
            message: Назва обов'язкова
        requestId: 3f2a9c1e-7b44-4d0e-9a51-0c2f6e8d1b77

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Некоректні дані (валідація)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Потрібен вхід
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            code: UNAUTHORIZED
            details: null
            requestId: 8b1d0f6a-2c3e-4f5a-9b7c-1d2e3f4a5b6c
    Forbidden:
      description: Недостатньо прав (не автор і не адмін)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            code: FORBIDDEN
            details: null
            requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    NotFound:
      description: Матеріал не знайдено або видалено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NotFound
            code: MATERIAL_NOT_FOUND
            details: null
            requestId: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
