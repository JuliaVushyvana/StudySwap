openapi: 3.0.3
info:
  title: StudySwap API
  version: 0.1.0
  description: |
    Контракт API платформи StudySwap для обміну навчальними матеріалами.
    Базовий CRUD для ресурсу «Матеріал» (контекст «Каталог матеріалів»)
    і реєстрація, вхід та вихід (контекст «Користувачі та доступ»).
    Коментарі під матеріалами (контекст «Обговорення»).

    Захищені запити передають токен із `POST /auth/login` у заголовку `Authorization: Bearer <JWT>`.
    Без дійсного токена (відсутній, підроблений, прострочений або відкликаний після `POST /auth/logout`)
    користувач вважається гостем, і захищений ендпоїнт відповідає `401`.

    Усі помилки повертаються в єдиному форматі `ErrorResponse`.

    Наскрізні правила (docs/adr/0004-error-handling-and-resilience.md):
    - `X-Request-Id` — клієнт може передати свій id запиту (до 128 символів), інакше сервер генерує UUID.
      Сервер завжди повертає його в заголовку відповіді й у полі `requestId` помилки.
    - `POST /materials` і `POST /materials/{id}/comments` вимагають `Idempotency-Key`: повтор із тим самим ключем не створює дубліката.
    - `429` і `503` містять заголовок `Retry-After` (секунди), після якого запит можна повторити.
      Безпечно повторювати `GET`, `PATCH`, `DELETE` і `POST` з тим самим `Idempotency-Key`.
    - Коли БД недоступна, `GET /materials` працює в degraded mode: віддає останню збережену копію каталогу з `degraded: true`.
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки

tags:
  - name: Auth
    description: Реєстрація, вхід і вихід
  - name: Materials
    description: Каталог навчальних матеріалів
  - name: Comments
    description: Коментарі під матеріалами
  - name: Health
    description: Службові ендпоїнти

paths:
  /health:
    get:
      tags: [Health]
      summary: Перевірка стану сервера та його залежностей
      description: |
        Не потребує входу й не обмежується rate limit. Перевіряє доступність БД.
        Використовується для моніторингу та healthcheck у Docker.
      operationId: getHealth
      responses:
        '200':
          description: Сервер і всі залежності працюють
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Сервер працює частково (degraded) — одна із залежностей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                checks:
                  database: fail

  /auth/register:
    post:
      tags: [Auth]
      summary: Зареєструватися
      description: |
        Створює акаунт із роллю `user`. Роль у тілі не приймається (`400 UNKNOWN_FIELD`).
        nickname, login і email унікальні без урахування регістру. Пароль зберігається лише як bcrypt-хеш.
        Після реєстрації клієнт входить через `POST /auth/login`.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Акаунт створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AccountConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Увійти за логіном або поштою
      description: |
        Якщо значення `login` містить `@`, пошук іде за поштою, інакше — за логіном.
        Неіснуючий акаунт і неправильний пароль дають однакову відповідь `401 INVALID_CREDENTIALS`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вхід виконано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Вийти
      description: Відкликає поточний токен; далі з ним користувач — гість.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Вихід виконано
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /materials:
    post:
      tags: [Materials]
      summary: Додати матеріал
      description: Створює новий матеріал. Автор визначається з токена, а не з тіла запиту.
      operationId: createMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreateRequest'
      responses:
        '201':
          description: Матеріал створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Materials]
      summary: Список матеріалів (пошук, фільтри, сортування)
      description: |
        Повертає опубліковані матеріали. Доступно всім, зокрема гостям.
        Якщо БД недоступна, повертає останню збережену копію каталогу з `degraded: true` (статус 200);
        якщо копії ще немає — 503 `CATALOG_UNAVAILABLE`.
      operationId: listMaterials
      parameters:
        - name: q
          in: query
          description: Пошук за назвою
          schema:
            type: string
            maxLength: 100
        - name: subject
          in: query
          schema:
            type: string
        - name: university
          in: query
          schema:
            type: string
        - name: course
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MaterialType'
        - name: sort
          in: query
          description: new — спочатку нові, title — за назвою А-Я
          schema:
            type: string
            enum: [new, title]
            default: new
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Список матеріалів (порожній, якщо нічого не знайдено)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /materials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор матеріалу
        schema:
          type: integer
          minimum: 1
        example: 100

    get:
      tags: [Materials]
      summary: Деталі матеріалу
      description: Сторінку матеріалу бачать усі, зокрема гість. Сам файл (GET /files/{id}) — лише зареєстровані.
      operationId: getMaterial
      responses:
        '200':
          description: Матеріал знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      tags: [Materials]
      summary: Оновити матеріал
      description: Частково оновлює матеріал. Змінювати може лише автор або адмін. Передаються тільки змінені поля.
      operationId: updateMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialUpdateRequest'
      responses:
        '200':
          description: Матеріал оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Materials]
      summary: Видалити матеріал
      description: Автор видаляє свій матеріал, адмін — будь-який.
      operationId: deleteMaterial
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Матеріал видалено (тіла відповіді немає)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /materials/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор матеріалу
        schema:
          type: integer
          minimum: 1
        example: 100

    get:
      tags: [Comments]
      summary: Коментарі під матеріалом
      description: Читати коментарі можуть усі, зокрема гість. Спочатку старіші.
      operationId: listComments
      responses:
        '200':
          description: Коментарі (порожній список, якщо їх немає)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [Comments]
      summary: Написати коментар
      description: |
        Коментувати можуть лише зареєстровані користувачі (business_doc №10).
        Повтор із тим самим `Idempotency-Key` повертає вже створений коментар.
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Коментар додано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /materials/{id}/comments/{commentId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор матеріалу
        schema:
          type: integer
          minimum: 1
        example: 100
      - name: commentId
        in: path
        required: true
        description: Ідентифікатор коментаря під цим матеріалом
        schema:
          type: integer
          minimum: 1
        example: 7

    delete:
      tags: [Comments]
      summary: Видалити коментар (адмін)
      description: Видаляти коментарі можуть лише адмін і суперадмін; автор свій коментар не видаляє.
      operationId: deleteComment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Коментар видалено (тіла відповіді немає)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Матеріал (MATERIAL_NOT_FOUND) або коментар під ним (COMMENT_NOT_FOUND) не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NotFound
                code: COMMENT_NOT_FOUND
                details: null
                requestId: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users:
    get:
      tags: [Roles]
      summary: Список користувачів (суперадмін)
      description: Лише для суперадміна. Пошук за нікнеймом, логіном або поштою; спочатку суперадмін і адміни.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Знайдені користувачі (без паролів)
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/role:
    patch:
      tags: [Roles]
      summary: Призначити або зняти адміна (суперадмін)
      description: |
        Лише суперадмін. Можна призначити user або admin. Заборонено: призначити superadmin (400 INVALID_ROLE),
        змінити власну роль або роль іншого суперадміна (403).
      operationId: setUserRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum: [user, admin]
            example:
              role: admin
      responses:
        '200':
          description: Роль змінено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me:
    get:
      tags: [Profile]
      summary: Мій профіль
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Дані акаунта того, хто увійшов (без пароля)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Змінити нікнейм або пошту
      description: Логін і роль змінити не можна. Потрібне хоча б одне поле.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Профіль оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AccountConflict'

  /users/me/password:
    post:
      tags: [Profile]
      summary: Змінити пароль
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Пароль змінено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/materials:
    get:
      tags: [Profile]
      summary: Мої матеріали
      operationId: listMyMaterials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Власні опубліковані матеріали, спочатку нові
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaterialResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /files:
    post:
      tags: [Files]
      summary: Завантажити файл матеріалу
      description: |
        Тіло запиту — сам файл (без multipart). Назва — у заголовку X-File-Name (encodeURIComponent).
        Формати й ліміти: pdf, ppt, pptx, zip — 50 МБ; doc, docx, txt — 20 МБ; mp3, wav — 30 МБ; mp4 — 100 МБ.
        Отриманий id передається як fileId у POST /materials.
      operationId: uploadFile
      security:
        - bearerAuth: []
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
          example: '%D0%A8%D0%BF%D0%B0%D1%80%D0%B3%D0%B0%D0%BB%D0%BA%D0%B0.pdf'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Файл збережено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /files/{id}:
    get:
      tags: [Files]
      summary: Скачати файл
      description: Перегляд і скачування файлу — лише для зареєстрованих (гість отримує 401). Відповідь — файл з оригінальною назвою (Content-Disposition).
      operationId: downloadFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Вміст файлу
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{id}/preview:
    get:
      tags: [Files]
      summary: Переглянути документ на сайті
      description: |
        PDF, Word (.docx) і TXT для перегляду прямо на сторінці (Content-Disposition inline, без кешу).
        Доступно всім, зокрема гостю. Скачати файл (GET /files/{id}) можуть лише зареєстровані.
      operationId: previewFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Вміст документа
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Унікальний ключ операції, який генерує клієнт (зазвичай UUID) і повторює при ретраях.
        Сервер пам'ятає ключ 24 години в межах користувача: повтор із тим самим тілом повертає
        той самий `201` без створення дубліката; той самий ключ з іншим тілом — `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,255}$'
      example: 6f1c2a9e-3b7d-4e21-9c55-8a0d4f7b1e33

  headers:
    X-Request-Id:
      description: Ідентифікатор запиту (з запиту клієнта або згенерований сервером)
      schema:
        type: string
    Retry-After:
      description: Через скільки секунд можна повторити запит
      schema:
        type: integer
        minimum: 1

  schemas:
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
      example:
        nickname: Julia V

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      example:
        currentPassword: studyswap123
        newPassword: newpassword1

    StoredFileResponse:
      type: object
      required: [id, fileName, sizeBytes, url]
      properties:
        id:
          type: string
        fileName:
          type: string
        sizeBytes:
          type: integer
        url:
          type: string
      example:
        id: 3f2a9c1e-7b44-4d0e-9a51-0c2f6e8d1b77
        fileName: Шпаргалка.pdf
        sizeBytes: 2097152
        url: /files/3f2a9c1e-7b44-4d0e-9a51-0c2f6e8d1b77

    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          description: Стан кожної залежності
          additionalProperties:
            type: string
            enum: [ok, fail]
      example:
        status: ok
        checks:
          database: ok

    MaterialType:
      type: string
      description: Тип матеріалу
      enum:
        - конспект
        - лекція
        - практична
        - лабораторна
        - презентація
        - відео
        - аудіо
        - курсова
        - дипломна
        - магістерська
      example: конспект

    MaterialCreateRequest:
      type: object
      description: DTO для створення матеріалу (тіло POST /materials)
      required: [title, subject, university, course, type, fileId]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        subject:
          type: string
          minLength: 1
        university:
          type: string
          minLength: 1
        course:
          type: integer
          minimum: 1
          maximum: 6
        type:
          $ref: '#/components/schemas/MaterialType'
        fileId:
          type: string
          description: Ключ уже завантаженого файлу у сховищі (StoredFile.id)
      example:
        title: Нормалізація БД
        description: 1НФ–3НФ з прикладами
        subject: Бази даних
        university: КПІ
        course: 2
        type: конспект
        fileId: f-8c1e2b

    MaterialUpdateRequest:
      type: object
      description: DTO для оновлення (тіло PATCH /materials/{id}). Усі поля необов'язкові, але потрібне хоча б одне. Новий fileId замінює файл (спершу POST /files).
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        subject:
          type: string
          minLength: 1
        university:
          type: string
          minLength: 1
        course:
          type: integer
          minimum: 1
          maximum: 6
        type:
          $ref: '#/components/schemas/MaterialType'
        fileId:
          type: string
          description: Замінити файл на інший, уже завантажений через POST /files
      example:
        title: Нормалізація БД (оновлено)
        course: 3

    MaterialFile:
      type: object
      description: Файл, прикріплений до матеріалу
      required: [fileName, format, sizeBytes, url]
      properties:
        fileName:
          type: string
        format:
          type: string
          enum: [pdf, doc, docx, txt, ppt, pptx, zip, mp3, wav, mp4]
        sizeBytes:
          type: integer
          minimum: 0
        url:
          type: string
      example:
        fileName: normalization.pdf
        format: pdf
        sizeBytes: 2097152
        url: /files/f-8c1e2b

    MaterialResponse:
      type: object
      description: DTO матеріалу у відповідях. Внутрішнє поле status не передається.
      required: [id, title, subject, university, course, type, file, authorId, authorNickname, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        subject:
          type: string
        university:
          type: string
        course:
          type: integer
        type:
          $ref: '#/components/schemas/MaterialType'
        file:
          $ref: '#/components/schemas/MaterialFile'
        authorId:
          type: integer
        authorNickname:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 100
        title: Нормалізація БД
        description: 1НФ–3НФ з прикладами
        subject: Бази даних
        university: КПІ
        course: 2
        type: конспект
        file:
          fileName: normalization.pdf
          format: pdf
          sizeBytes: 2097152
          url: /files/f-8c1e2b
        authorId: 1
        authorNickname: Anna
        createdAt: '2026-11-20T10:15:00Z'
        updatedAt: '2026-11-20T11:20:00Z'

    MaterialListResponse:
      type: object
      description: Сторінка результатів пошуку
      required: [items, total, page, degraded]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialResponse'
        total:
          type: integer
          description: Скільки всього знайдено
        page:
          type: integer
          description: Номер поточної сторінки
        degraded:
          type: boolean
          description: true — БД недоступна, дані з останньої збереженої копії каталогу й можуть бути застарілими

    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Текст коментаря; пробіли на початку й у кінці обрізаються
      example:
        text: Дякую, дуже допомогло перед модулем!

    CommentResponse:
      type: object
      required: [id, materialId, authorId, authorNickname, text, createdAt]
      properties:
        id:
          type: integer
        materialId:
          type: integer
        authorId:
          type: integer
        authorNickname:
          type: string
          description: Актуальний нікнейм автора коментаря
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 7
        materialId: 100
        authorId: 2
        authorNickname: Julia
        text: Дякую, дуже допомогло перед модулем!
        createdAt: '2026-11-23T09:30:00Z'

    CommentListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        total:
          type: integer

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [nickname, login, email, password, birthDate]
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 30
        login:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          description: Не довше 72 байт у UTF-8 (обмеження bcrypt)
        birthDate:
          type: string
          format: date
          description: Дата в минулому, YYYY-MM-DD
      example:
        nickname: Olha
        login: olha_m
        email: olha@uni.ua
        password: secret123
        birthDate: '2004-05-01'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Логін або пошта
        password:
          type: string
          format: password
      example:
        login: olha_m
        password: secret123

    UserResponse:
      type: object
      description: Дані акаунта. passwordHash ніколи не повертається.
      required: [id, nickname, login, email, birthDate, avatarUrl, role]
      properties:
        id:
          type: integer
        nickname:
          type: string
        login:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin, superadmin]
          description: superadmin — адмін, який ще й призначає та знімає адмінів
      example:
        id: 4
        nickname: Olha
        login: olha_m
        email: olha@uni.ua
        birthDate: '2004-05-01'
        avatarUrl: null
        role: user

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT (HS256) для заголовка Authorization
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Скільки секунд діє токен
        user:
          $ref: '#/components/schemas/UserResponse'
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0Iiwicm9sZSI6InVzZXIifQ.signature
        tokenType: Bearer
        expiresIn: 3600
        user:
          id: 4
          nickname: Olha
          login: olha_m
          email: olha@uni.ua
          birthDate: '2004-05-01'
          avatarUrl: null
          role: user

    ErrorResponse:
      type: object
      description: |
        Єдиний формат помилки для всіх ендпоїнтів.

        Коди (`code`) за категоріями:
        - ValidationError (400): TITLE_REQUIRED, TITLE_TOO_LONG, INVALID_DESCRIPTION,
          DESCRIPTION_TOO_LONG, SUBJECT_REQUIRED, UNIVERSITY_REQUIRED, COURSE_OUT_OF_RANGE,
          INVALID_TYPE, FILE_REQUIRED, INVALID_FILE, EMPTY_UPDATE, UNKNOWN_FIELD,
          INVALID_BODY, INVALID_JSON, QUERY_TOO_LONG, INVALID_QUERY, INVALID_SORT, INVALID_PAGE;
        - ValidationError (400), Idempotency-Key: IDEMPOTENCY_KEY_REQUIRED, INVALID_IDEMPOTENCY_KEY;
        - ValidationError (400), /auth/*: NICKNAME_REQUIRED, INVALID_NICKNAME, LOGIN_REQUIRED, INVALID_LOGIN,
          EMAIL_REQUIRED, INVALID_EMAIL, PASSWORD_REQUIRED, PASSWORD_TOO_SHORT, PASSWORD_TOO_LONG,
          BIRTH_DATE_REQUIRED, INVALID_BIRTH_DATE, UNKNOWN_FIELD, INVALID_BODY;
        - ValidationError (400), коментарі: TEXT_REQUIRED, TEXT_TOO_LONG, UNKNOWN_FIELD, INVALID_BODY;
        - Unauthorized (401): UNAUTHORIZED, INVALID_CREDENTIALS;
        - Forbidden (403): FORBIDDEN;
        - NotFound (404): MATERIAL_NOT_FOUND, COMMENT_NOT_FOUND, ROUTE_NOT_FOUND;
        - Conflict (409): IDEMPOTENCY_KEY_REUSED, LOGIN_TAKEN, NICKNAME_TAKEN, EMAIL_TAKEN;
        - TooManyRequests (429): RATE_LIMITED;
        - InternalError (500): code = null;
        - ServiceUnavailable (503): REQUEST_TIMEOUT, CATALOG_UNAVAILABLE, SERVICE_UNAVAILABLE.

        Політика кодів — docs/adr/0003-api-style-and-error-model.md.
      required: [error, requestId]
      properties:
        error:
          type: string
          description: Категорія помилки
          enum: [ValidationError, Unauthorized, Forbidden, NotFound, Conflict, TooManyRequests, InternalError, ServiceUnavailable]
        code:
          type: string
          nullable: true
          description: Конкретна причина
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Ідентифікатор запиту для пошуку в логах
      example:
        error: ValidationError
        code: TITLE_REQUIRED
        details:
          - field: title
            message: Назва обов'язкова
        requestId: 3f2a9c1e-7b44-4d0e-9a51-0c2f6e8d1b77

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    AccountConflict:
      description: nickname, login або email уже зайняті
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Conflict
            code: LOGIN_TAKEN
            details: null
            requestId: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
    InvalidCredentials:
      description: Неправильний логін (пошта) або пароль
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            code: INVALID_CREDENTIALS
            details: null
            requestId: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
    Conflict:
      description: Idempotency-Key уже використано з іншим тілом запиту
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Conflict
            code: IDEMPOTENCY_KEY_REUSED
            details: null
            requestId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    TooManyRequests:
      description: Перевищено ліміт запитів; повторити після Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TooManyRequests
            code: RATE_LIMITED
            details: null
            requestId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
    InternalError:
      description: Непередбачена помилка сервера
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: InternalError
            code: null
            details: null
            requestId: 3e4f5a6b-7c8d-4e9f-0a1b-2c3d4e5f6a7b
    ServiceUnavailable:
      description: Сервер тимчасово не може обробити запит (таймаут, недоступна БД); повторити після Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: ServiceUnavailable
            code: REQUEST_TIMEOUT
            details: null
            requestId: 4f5a6b7c-8d9e-4f0a-1b2c-3d4e5f6a7b8c
    BadRequest:
      description: Некоректні дані (валідація)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Потрібен вхід
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            code: UNAUTHORIZED
            details: null
            requestId: 8b1d0f6a-2c3e-4f5a-9b7c-1d2e3f4a5b6c
    Forbidden:
      description: Недостатньо прав (не автор і не адмін)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            code: FORBIDDEN
            details: null
            requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    NotFound:
      description: Матеріал не знайдено або видалено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NotFound
            code: MATERIAL_NOT_FOUND
            details: null
            requestId: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
