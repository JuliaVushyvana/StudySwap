# CD: після зеленого CI збирає образи api і web та публікує їх у GitHub Container Registry (GHCR).
# Запуск: push у main, тег v* (реліз) або вручну (Actions → CD → Run workflow).
#   ghcr.io/<owner>/studyswap-api — бекенд (./backend)
#   ghcr.io/<owner>/studyswap-web — фронтенд (./frontend)
# Теги образів: sha-<commit> завжди, vX.Y.Z і vX.Y на тег релізу, latest на main.
name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# За замовчуванням токен лише читає код; ширші права — тільки в job-ах, яким вони потрібні
permissions:
  contents: read

# Новий запуск для того ж ref (гілки чи тегу) скасовує застарілий: публікується лише свіжий коміт
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. CI: той самий reusable workflow, що й у ci.yml ----------
  backend:
    name: backend
    uses: ./.github/workflows/ci-reusable.yml
    with:
      working-directory: backend
      node-version: '22'
      coverage: true

  frontend:
    name: frontend
    uses: ./.github/workflows/ci-reusable.yml
    with:
      working-directory: frontend
      node-version: '22'
      build: true

  # ---------- 2. Збірка, публікація і сканування образів ----------
  publish:
    name: publish ${{ matrix.service }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ручне підтвердження: Settings → Environments → staging → Required reviewers
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/pkgs/container/studyswap-${{ matrix.service }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
          - service: web
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR приймає назви образів лише малими літерами (JuliaVushyvana → juliavushyvana)
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/studyswap-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги й OCI-мітки; мітка source пов'язує пакет із репозиторієм
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Кеш шарів у GitHub Actions cache, окремий для кожного сервісу
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Звіт про вразливості; exit-code 0 — знахідки не валять збірку.
      # Версія закріплена за SHA (v0.36.0): у березні 2026 теги trivy-action були скомпрометовані
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          output: trivy-${{ matrix.service }}.txt

      - name: Job Summary
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/pkgs/container/studyswap-${{ matrix.service }}
        run: |
          {
            echo "## 🐳 studyswap-${{ matrix.service }}"
            echo
            echo "Пакет: [$IMAGE]($PACKAGE_URL)  "
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Тег |"
            echo "|---|"
            while read -r tag; do [ -n "$tag" ] && echo "| \`$tag\` |"; done <<< "$TAGS"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:sha-${GITHUB_SHA::7}"
            echo '```'
            echo
            echo "<details><summary>Trivy: вразливості HIGH/CRITICAL (з виправленнями)</summary>"
            echo
            echo '```'
            cat "trivy-${{ matrix.service }}.txt" 2>/dev/null || echo "звіт Trivy відсутній"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 3. Загальний підсумок: coverage з CI і посилання ----------
  summary:
    name: summary
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Артефакт coverage-backend завантажує ci-reusable.yml (npm run test:coverage → coverage/lcov.info)
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage

      - name: Job Summary
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pct() { awk -F: -v f="$1" -v h="$2" '$1==f{t+=$2} $1==h{c+=$2} END{if(t) printf "%.1f%% (%d/%d)", c*100/t, c, t; else print "—"}' coverage/lcov.info; }
          {
            echo "## 📦 Delivery"
            echo
            echo "| Сервіс | Образ |"
            echo "|---|---|"
            echo "| api | [ghcr.io/$owner/studyswap-api](https://github.com/$GITHUB_REPOSITORY/pkgs/container/studyswap-api) |"
            echo "| web | [ghcr.io/$owner/studyswap-web](https://github.com/$GITHUB_REPOSITORY/pkgs/container/studyswap-web) |"
            echo
            echo "Ref: \`$GITHUB_REF_NAME\`, commit \`${GITHUB_SHA::7}\`"
            echo
            echo "### Coverage (backend)"
            echo
            if [ -f coverage/lcov.info ]; then
              echo "| Рядки | Гілки | Функції |"
              echo "|---|---|---|"
              echo "| $(pct LF LH) | $(pct BRF BRH) | $(pct FNF FNH) |"
            else
              echo "Артефакт coverage-backend не знайдено."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 4. Чернетка релізу на тег v* ----------
  release:
    name: release notes
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Створення релізу потребує запису в репозиторій
    permissions:
      contents: write
    steps:
      - name: Image names
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Образи

            ```bash
            docker pull ghcr.io/${{ steps.image.outputs.owner }}/studyswap-api:${{ github.ref_name }}
            docker pull ghcr.io/${{ steps.image.outputs.owner }}/studyswap-web:${{ github.ref_name }}
            ```
